[client]
# 발표 화면: Deploy 버튼·개발자 메뉴 숨김
toolbarMode = "minimal"

[theme]
# DESIGN.md 토큰 (커버 화면과 같은 체계): 리넨 바탕 · 숲색 잉크 · 본/안개 면과 선
base = "light"
primaryColor = "#0a1d08"              # 선택 상태·주 버튼 = 숲색 잉크 (Streamlit 기본 빨강은 진단 "쇠퇴 우려" 색과 겹침)
backgroundColor = "#f8f9f5"           # 리넨
secondaryBackgroundColor = "#eff2e8"  # 본 (입력칸·사이드바)
textColor = "#0a1d08"
borderColor = "#e1e6df"               # 안개
dataframeBorderColor = "#e1e6df"
dataframeHeaderBackgroundColor = "#eff2e8"
linkColor = "#4a6d47"
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css, 'Apple SD Gothic Neo', sans-serif"
headingFont = "Pretendard, 'Apple SD Gothic Neo', sans-serif"   # 세리프는 화면당 제목 하나만 (app.py .serif)
baseRadius = "8px"
buttonRadius = "20px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#eff2e8"
secondaryBackgroundColor = "#f8f9f5"
borderColor = "#a5ac9f"               # 세이지 안개: 본 바탕 위 라디오·버튼 테두리가 보이게
